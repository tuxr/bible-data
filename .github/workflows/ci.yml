name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Fetch sources
        run: swift run bible-pack sources fetch
      - name: Test
        run: swift test
      - name: CLI smoke
        run: |
          swift run bible-pack --help
          swift run bible-pack sources --help
          swift run bible-pack sources show
          swift run bible-pack canon build --out .build/canon.sqlite && swift run bible-pack canon validate .build/canon.sqlite
          swift run bible-pack parse bsb
          swift run bible-pack parse wlc
          swift run bible-pack parse tcgnt
      - name: Package smoke
        run: |
          for edition in bsb wlc tcgnt; do
            swift run -c release bible-pack build "$edition" --out .build/dist --version 2026.10
            swift run -c release bible-pack validate ".build/dist/$edition-2026.10.bible" --against-source
          done
      - name: Words and lexicon smoke
        run: |
          pack() { swift run -c release bible-pack "$@"; }
          pack build-words wlc --out .build/dist --version 2026.10
          pack build-words tcgnt --out .build/dist --version 2026.10
          pack build-lexicon hebrew --out .build/dist --version 2026.10 --count-from .build/dist/wlc-2026.10.words
          pack build-lexicon greek --out .build/dist --version 2026.10 --count-from .build/dist/tcgnt-2026.10.words
          pack validate .build/dist/wlc-2026.10.words --against-source --lexicon .build/dist/lexicon-hebrew-2026.10.lexicon
          pack validate .build/dist/tcgnt-2026.10.words --against-source --lexicon .build/dist/lexicon-greek-2026.10.lexicon
          pack validate .build/dist/lexicon-hebrew-2026.10.lexicon --words .build/dist/wlc-2026.10.words
          pack validate .build/dist/lexicon-greek-2026.10.lexicon --words .build/dist/tcgnt-2026.10.words
          pack manifest build --dist .build/dist --generated-at 2026-10-30T00:00:00Z
          pack manifest validate .build/dist/manifest.json --dist .build/dist
